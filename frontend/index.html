    <title>ASSO.N.A.M. - Studio e Portale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@500;700&family=Sora:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var storageKey = "assonam-theme";
        var storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem(storageKey);
        } catch (error) {
          storedTheme = null;
        }
        var preference = storedTheme === "light" || storedTheme === "dark"
          ? storedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        var root = document.documentElement;
        root.dataset.theme = preference;
        root.dataset.themePreference = preference;
        root.classList.toggle("theme-dark", preference === "dark");
        root.classList.toggle("theme-light", preference === "light");
        root.style.colorScheme = preference;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute("content", preference === "dark" ? "#0f1722" : "#0f2326");
        }
      })();
    </script>
  </head>
  <body class="bg-neutral-25 text-neutral-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
