  FILE_DELETION_BATCH_SIZE: ${FILE_DELETION_BATCH_SIZE:-50}
  FILE_DELETION_POLL_SECONDS: ${FILE_DELETION_POLL_SECONDS:-5}
  FILE_DELETION_STALE_AFTER_SECONDS: ${FILE_DELETION_STALE_AFTER_SECONDS:-300}
  BASE_URL: ${BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  SECRET_KEY: ${SECRET_KEY}
  GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
  GOOGLE_WALLET_SA_B64: ${GOOGLE_WALLET_SA_B64}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  TWILIO_LOW_CARDS_FLOW_SID: ${TWILIO_LOW_CARDS_FLOW_SID}
  TWILIO_ALERT_FLOW_SID: ${TWILIO_ALERT_FLOW_SID}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
  TWILIO_SMS_FROM: ${TWILIO_SMS_FROM}
  ADMIN_PHONE_E164: ${ADMIN_PHONE_E164}
  TG_BOT_TOKEN: ${TG_BOT_TOKEN}
  TG_CHAT_ID: ${TG_CHAT_ID}
  ENABLE_WHATSAPP_EVOLUTION: ${ENABLE_WHATSAPP_EVOLUTION:-false}
  ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-false}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-green_api}
  GREEN_API_BASE_URL: ${GREEN_API_BASE_URL:-https://api.green-api.com}
  GREEN_API_WEBHOOK_SECRET: ${GREEN_API_WEBHOOK_SECRET:-}
  GREEN_API_WEBHOOK_REQUIRE_SECRET: ${GREEN_API_WEBHOOK_REQUIRE_SECRET:-false}
  GREEN_API_WEBHOOK_ALLOWED_IPS: ${GREEN_API_WEBHOOK_ALLOWED_IPS:-46.101.109.139,51.250.12.167,51.250.84.44,51.250.95.149,89.169.137.216,158.160.49.84,165.22.93.202,167.172.162.71,104.248.252.93,158.160.139.176,64.226.111.11,207.154.255.195}
  WHATSAPP_WEBHOOK_MAX_BODY_BYTES: ${WHATSAPP_WEBHOOK_MAX_BODY_BYTES:-524288}
  EVOLUTION_API_BASE_URL: ${EVOLUTION_API_BASE_URL:-http://evolution-api:8080}
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
  WHATSAPP_WEBHOOK_BATCH_SIZE: ${WHATSAPP_WEBHOOK_BATCH_SIZE:-50}
  WHATSAPP_WEBHOOK_POLL_SECONDS: ${WHATSAPP_WEBHOOK_POLL_SECONDS:-2}
  WHATSAPP_WEBHOOK_STALE_AFTER_SECONDS: ${WHATSAPP_WEBHOOK_STALE_AFTER_SECONDS:-300}
  WHATSAPP_OUTBOUND_QUEUE_ENABLED: ${WHATSAPP_OUTBOUND_QUEUE_ENABLED:-true}
  WHATSAPP_OUTBOUND_BATCH_SIZE: ${WHATSAPP_OUTBOUND_BATCH_SIZE:-20}
  WHATSAPP_OUTBOUND_MIN_INTERVAL_SECONDS: ${WHATSAPP_OUTBOUND_MIN_INTERVAL_SECONDS:-60}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  LOW_CARDS_ALERT_JOB_INTERVAL_SECONDS: ${LOW_CARDS_ALERT_JOB_INTERVAL_SECONDS:-300}
  AFFILIAZIONE_ENABLED: ${AFFILIAZIONE_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_THIN_WEBHOOK_SECRET: ${STRIPE_THIN_WEBHOOK_SECRET:-}
  STRIPE_BILLING_WEBHOOK_SECRET: ${STRIPE_BILLING_WEBHOOK_SECRET:-}
  STRIPE_PLATFORM_PRICE_ID: ${STRIPE_PLATFORM_PRICE_ID:-}
  STRIPE_REQUIRE_PUBLISHABLE_KEY: ${STRIPE_REQUIRE_PUBLISHABLE_KEY:-false}
  ENABLE_STRIPE_CONNECT_DEMO: ${ENABLE_STRIPE_CONNECT_DEMO:-false}
  AFFILIATION_VIDEO_WORKER_ENABLED: ${AFFILIATION_VIDEO_WORKER_ENABLED:-false}
  AFFILIATION_VIDEO_ENABLED: ${AFFILIATION_VIDEO_ENABLED:-true}
  AFFILIATION_VIDEO_RENDERER_DIR: ${AFFILIATION_VIDEO_RENDERER_DIR:-/app/video-renderer/services/welcome-video}
  AFFILIATION_VIDEO_OUTPUT_DIR: ${AFFILIATION_VIDEO_OUTPUT_DIR:-/app/data/videos/welcome}
  AFFILIATION_VIDEO_RENDER_CONCURRENCY: ${AFFILIATION_VIDEO_RENDER_CONCURRENCY:-}
  AFFILIATION_VIDEO_POLL_SECONDS: ${AFFILIATION_VIDEO_POLL_SECONDS:-}
  SUMUP_CREDENTIALS_ENCRYPTION_KEY: ${SUMUP_CREDENTIALS_ENCRYPTION_KEY:-}

x-video-worker-env: &video-worker-env
  PYTHONUNBUFFERED: "1"
  APP_ENV: ${APP_ENV:?Set APP_ENV explicitly to local, test, staging, or production}
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
  BASE_URL: ${BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  SECRET_KEY: ${SECRET_KEY}
  AFFILIAZIONE_ENABLED: ${AFFILIAZIONE_ENABLED:-false}
  AFFILIATION_VIDEO_WORKER_ENABLED: ${AFFILIATION_VIDEO_WORKER_ENABLED:-false}
  AFFILIATION_VIDEO_ENABLED: ${AFFILIATION_VIDEO_ENABLED:-true}
  AFFILIATION_VIDEO_RENDERER_DIR: ${AFFILIATION_VIDEO_RENDERER_DIR:-/app/video-renderer/services/welcome-video}
  AFFILIATION_VIDEO_OUTPUT_DIR: ${AFFILIATION_VIDEO_OUTPUT_DIR:-/app/data/videos/welcome}
  AFFILIATION_VIDEO_RENDER_CONCURRENCY: ${AFFILIATION_VIDEO_RENDER_CONCURRENCY:-}
  AFFILIATION_VIDEO_POLL_SECONDS: ${AFFILIATION_VIDEO_POLL_SECONDS:-}
  AUDIO_SOURCE: ${AUDIO_SOURCE:-local}
  AUDIO_LOCAL_PATH: ${AUDIO_LOCAL_PATH:-/app/video-renderer/services/welcome-video/assets/audio}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_VOICE_IDS: ${ELEVENLABS_VOICE_IDS:-}
  ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-}
  ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assonam
      POSTGRES_USER: assonam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    build: .
    depends_on:
      - db
    ports:
      # Nginx runs on the host and proxies to this loopback socket. Do not
      # expose Uvicorn directly on every interface, bypassing TLS and limits.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data

    environment: *app-env

    restart: always

  migrate:
    profiles: ["ops"]
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    depends_on:
      - db
    command: alembic upgrade head
    volumes:
      - ./data:/app/data
    environment: *app-env
    mem_limit: ${MIGRATE_MEM_LIMIT:-1024m}
    restart: "no"

  email-worker:
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    depends_on:
      - db
    command: python -m app.workers.email_sender
    volumes:
      - ./data:/app/data
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${EMAIL_WORKER_MEM_LIMIT:-512m}
    restart: always

  low-cards-worker:
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    depends_on:
      - db
    command: python -m app.workers.low_cards_scheduler
    volumes:
      - ./data:/app/data
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${LOW_CARDS_WORKER_MEM_LIMIT:-512m}
    restart: always

  file-deletion-worker:
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    depends_on:
      - db
    command: python -m app.workers.file_deletion_worker
    volumes:
      - ./data:/app/data
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${FILE_DELETION_WORKER_MEM_LIMIT:-256m}
    restart: always

  whatsapp-webhook-worker:
    image: ${APP_RUNTIME_IMAGE:-assonam/app-runtime:local}
    depends_on:
      - db
    command: python -m app.workers.whatsapp_webhook_worker
    volumes:
      - ./data:/app/data
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${WHATSAPP_WEBHOOK_WORKER_MEM_LIMIT:-512m}
    restart: always

  affiliation-video-worker:
    profiles: ["video-worker"]
    image: ${AFFILIATION_VIDEO_WORKER_IMAGE:-assonam/affiliation-video-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.affiliation-video-worker
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    environment: *video-worker-env
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker.ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: ${AFFILIATION_VIDEO_WORKER_MEM_LIMIT:-4096m}
    restart: always

volumes:
  pgdata:

