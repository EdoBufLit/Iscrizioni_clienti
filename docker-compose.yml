version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assonam
      POSTGRES_USER: assonam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

    environment:
      # DB
      # SQLite (container default): sqlite:////app/data/app.db
      # PostgreSQL (compose service): postgresql+psycopg2://assonam:${POSTGRES_PASSWORD}@db:5432/assonam
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      SKIP_CREATE_ALL: "1"

      # Super admin
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS}

      # App / misc
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SECRET_KEY: ${SECRET_KEY}

      # Google Wallet (optional)
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GOOGLE_WALLET_SA_B64: ${GOOGLE_WALLET_SA_B64}

    restart: always

volumes:
  pgdata:

