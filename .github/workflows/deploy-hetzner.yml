name: Deploy to Hetzner

on:
  push:
    branches:
      - association-signup-feature-1416851812972636353
      - feat/**
  workflow_dispatch:
    inputs:
      MIGRATE:
        description: Run SQLite -> Postgres import before deploy restart
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-hetzner
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_runtime_changed: ${{ steps.changes.outputs.app_runtime }}
      runtime_config_changed: ${{ steps.changes.outputs.runtime_config }}
      video_worker_changed: ${{ steps.changes.outputs.video_worker }}
      evolution_changed: ${{ steps.changes.outputs.evolution }}
      app_runtime_image_branch: ${{ steps.image_vars.outputs.app_runtime_image_branch }}
      app_runtime_image_sha: ${{ steps.image_vars.outputs.app_runtime_image_sha }}
      video_worker_image_branch: ${{ steps.image_vars.outputs.video_worker_image_branch }}
      video_worker_image_sha: ${{ steps.image_vars.outputs.video_worker_image_sha }}
      evolution_image_branch: ${{ steps.image_vars.outputs.evolution_image_branch }}
      evolution_image_sha: ${{ steps.image_vars.outputs.evolution_image_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check deploy files
        run: |
          set -euo pipefail
          if [ ! -f "Dockerfile.affiliation-video-worker" ]; then
            echo "::error::Missing Dockerfile.affiliation-video-worker referenced by docker-compose.yml"
            exit 1
          fi
          if [ ! -f "docker-compose.evolution-lite.yml" ]; then
            echo "::error::Missing docker-compose.evolution-lite.yml"
            exit 1
          fi
          if [ ! -f "scripts/render_evolution_lite_env.py" ]; then
            echo "::error::Missing scripts/render_evolution_lite_env.py"
            exit 1
          fi
          for deploy_file in \
            scripts/prepare_deploy_bundle.py \
            scripts/render_pgloader_load.py \
            scripts/deploy_remote.sh; do
            if [ ! -f "$deploy_file" ]; then
              echo "::error::Missing $deploy_file"
              exit 1
            fi
          done

      - name: Resolve changed-files base
        id: change_base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
            echo "base=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed deploy targets
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.change_base.outputs.base }}
          ref: ${{ github.sha }}
          filters: |
            app_runtime:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'requirements.lock'
              - 'init_db.py'
              - 'alembic/**'
              - 'app/**'
              - 'frontend/**'
            runtime_config:
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
            video_worker:
              - 'Dockerfile.affiliation-video-worker'
              - 'docker-compose.yml'
              - 'requirements.txt'
              - 'app/config.py'
              - 'app/db.py'
              - 'app/models_affiliation.py'
              - 'app/services/affiliation_video.py'
              - 'app/workers/affiliation_video_worker.py'
              - 'video-renderer/**'
            evolution:
              - 'docker-compose.evolution-lite.yml'
              - 'docker/evolution-lite/**'

      - name: Compute image tags
        id: image_vars
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          BRANCH_TAG="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          echo "app_runtime_image_branch=ghcr.io/${OWNER_LC}/assonam-app-runtime:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "video_worker_image_branch=ghcr.io/${OWNER_LC}/assonam-affiliation-video-worker:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "evolution_image_branch=ghcr.io/${OWNER_LC}/assonam-evolution-api-lite:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_runtime_image_sha=ghcr.io/${OWNER_LC}/assonam-app-runtime:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "video_worker_image_sha=ghcr.io/${OWNER_LC}/assonam-affiliation-video-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "evolution_image_sha=ghcr.io/${OWNER_LC}/assonam-evolution-api-lite:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log image build plan
        run: |
          echo "app_runtime_changed=${{ steps.changes.outputs.app_runtime }}"
          echo "runtime_config_changed=${{ steps.changes.outputs.runtime_config }}"
          echo "video_worker_changed=${{ steps.changes.outputs.video_worker }}"
          echo "evolution_changed=${{ steps.changes.outputs.evolution }}"
          echo "app_runtime_image=${{ steps.image_vars.outputs.app_runtime_image_branch }}"
          echo "video_worker_image=${{ steps.image_vars.outputs.video_worker_image_branch }}"
          echo "evolution_image=${{ steps.image_vars.outputs.evolution_image_branch }}"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.app_runtime == 'true' || steps.changes.outputs.video_worker == 'true' || steps.changes.outputs.evolution == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.changes.outputs.app_runtime == 'true' || steps.changes.outputs.video_worker == 'true' || steps.changes.outputs.evolution == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push app runtime image
        if: steps.changes.outputs.app_runtime == 'true'
        env:
          APP_RUNTIME_IMAGE_BRANCH: ${{ steps.image_vars.outputs.app_runtime_image_branch }}
          APP_RUNTIME_IMAGE_SHA: ${{ steps.image_vars.outputs.app_runtime_image_sha }}
        run: |
          set -euo pipefail
          echo "[build] app-runtime image"
          date -u +"[build] started_at=%Y-%m-%dT%H:%M:%SZ"
          free -m
          docker stats --no-stream || true
          /usr/bin/time -v docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --push \
            -f Dockerfile \
            -t "$APP_RUNTIME_IMAGE_SHA" \
            -t "$APP_RUNTIME_IMAGE_BRANCH" \
            .
          free -m
          docker stats --no-stream || true

      - name: Build and push affiliation video worker image
        if: steps.changes.outputs.video_worker == 'true'
        env:
          VIDEO_WORKER_IMAGE_BRANCH: ${{ steps.image_vars.outputs.video_worker_image_branch }}
          VIDEO_WORKER_IMAGE_SHA: ${{ steps.image_vars.outputs.video_worker_image_sha }}
        run: |
          set -euo pipefail
          echo "[build] affiliation-video-worker image"
          date -u +"[build] started_at=%Y-%m-%dT%H:%M:%SZ"
          free -m
          docker stats --no-stream || true
          /usr/bin/time -v docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --push \
            -f Dockerfile.affiliation-video-worker \
            -t "$VIDEO_WORKER_IMAGE_SHA" \
            -t "$VIDEO_WORKER_IMAGE_BRANCH" \
            .
          free -m
          docker stats --no-stream || true

      - name: Build and push evolution image
        if: steps.changes.outputs.evolution == 'true'
        env:
          EVOLUTION_IMAGE_BRANCH: ${{ steps.image_vars.outputs.evolution_image_branch }}
          EVOLUTION_IMAGE_SHA: ${{ steps.image_vars.outputs.evolution_image_sha }}
        run: |
          set -euo pipefail
          echo "[build] evolution-api image"
          date -u +"[build] started_at=%Y-%m-%dT%H:%M:%SZ"
          free -m
          docker stats --no-stream || true
          /usr/bin/time -v docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --push \
            -f docker/evolution-lite/Dockerfile \
            -t "$EVOLUTION_IMAGE_SHA" \
            -t "$EVOLUTION_IMAGE_BRANCH" \
            .
          free -m
          docker stats --no-stream || true

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check deploy files
        run: |
          set -euo pipefail
          if [ ! -f "Dockerfile.affiliation-video-worker" ]; then
            echo "::error::Missing Dockerfile.affiliation-video-worker referenced by docker-compose.yml"
            exit 1
          fi
          if [ ! -f "docker-compose.evolution-lite.yml" ]; then
            echo "::error::Missing docker-compose.evolution-lite.yml"
            exit 1
          fi
          if [ ! -f "scripts/render_evolution_lite_env.py" ]; then
            echo "::error::Missing scripts/render_evolution_lite_env.py"
            exit 1
          fi
          for deploy_file in \
            scripts/prepare_deploy_bundle.py \
            scripts/render_pgloader_load.py \
            scripts/deploy_remote.sh; do
            if [ ! -f "$deploy_file" ]; then
              echo "::error::Missing $deploy_file"
              exit 1
            fi
          done

      - name: Wait for Hetzner SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$HETZNER_SSH_KEY" > "$KEY_FILE"
          if [ -z "$HETZNER_KNOWN_HOSTS" ]; then
            echo "::error::Pinned Hetzner host key is missing"
            exit 1
          fi
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          DEADLINE=$(( $(date +%s) + 1200 ))
          until ssh -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=10 \
            "$HETZNER_USER@$HETZNER_HOST" "echo ready" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Hetzner SSH not reachable after 20 minutes"
              exit 1
            fi
            echo "[deploy] SSH handshake not ready yet, retrying in 20s"
            sleep 20
          done

          echo "[deploy] SSH handshake ready"

      - name: Deploy via protected SSH stdin
        timeout-minutes: 35
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          APP_PATH: ${{ secrets.APP_PATH }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR }}
          SPA_DIR: ${{ secrets.SPA_DIR }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_WALLET_SA_B64: ${{ secrets.GOOGLE_WALLET_SA_B64 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_TRANSPORT: ${{ secrets.EMAIL_TRANSPORT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_EMAIL_API_BASE_URL: ${{ secrets.CLOUDFLARE_EMAIL_API_BASE_URL }}
          MAIL_FROM_DOMAIN: ${{ secrets.MAIL_FROM_DOMAIN }}
          ASSOCIATION_MAIL_API_TOKEN: ${{ secrets.ASSOCIATION_MAIL_API_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TWILIO_LOW_CARDS_FLOW_SID: ${{ secrets.TWILIO_LOW_CARDS_FLOW_SID }}
          TWILIO_ALERT_FLOW_SID: ${{ secrets.TWILIO_ALERT_FLOW_SID }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          ADMIN_PHONE_E164: ${{ secrets.ADMIN_PHONE_E164 }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_THIN_WEBHOOK_SECRET: ${{ secrets.STRIPE_THIN_WEBHOOK_SECRET }}
          STRIPE_BILLING_WEBHOOK_SECRET: ${{ secrets.STRIPE_BILLING_WEBHOOK_SECRET }}
          STRIPE_PLATFORM_PRICE_ID: ${{ secrets.STRIPE_PLATFORM_PRICE_ID }}
          STRIPE_REQUIRE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_REQUIRE_PUBLISHABLE_KEY }}
          ENABLE_STRIPE_CONNECT_DEMO: ${{ secrets.ENABLE_STRIPE_CONNECT_DEMO }}
          AFFILIATION_VIDEO_WORKER_ENABLED: ${{ secrets.AFFILIATION_VIDEO_WORKER_ENABLED }}
          AFFILIATION_VIDEO_ENABLED: ${{ secrets.AFFILIATION_VIDEO_ENABLED }}
          ENABLE_WHATSAPP_EVOLUTION: ${{ secrets.ENABLE_WHATSAPP_EVOLUTION }}
          ENABLE_WHATSAPP: ${{ secrets.ENABLE_WHATSAPP }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          GREEN_API_BASE_URL: ${{ secrets.GREEN_API_BASE_URL }}
          GREEN_API_WEBHOOK_SECRET: ${{ secrets.GREEN_API_WEBHOOK_SECRET }}
          GREEN_API_WEBHOOK_ALLOWED_IPS: ${{ secrets.GREEN_API_WEBHOOK_ALLOWED_IPS }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          SUMUP_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.SUMUP_CREDENTIALS_ENCRYPTION_KEY }}
          AFFILIAZIONE_ENABLED: ${{ secrets.AFFILIAZIONE_ENABLED }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          APP_RUNTIME_CHANGED: ${{ needs.build-images.outputs.app_runtime_changed }}
          RUNTIME_CONFIG_CHANGED: ${{ needs.build-images.outputs.runtime_config_changed }}
          VIDEO_WORKER_CHANGED: ${{ needs.build-images.outputs.video_worker_changed }}
          EVOLUTION_CHANGED: ${{ needs.build-images.outputs.evolution_changed }}
          APP_RUNTIME_IMAGE: ${{ needs.build-images.outputs.app_runtime_changed == 'true' && needs.build-images.outputs.app_runtime_image_sha || needs.build-images.outputs.app_runtime_image_branch }}
          AFFILIATION_VIDEO_WORKER_IMAGE: ${{ needs.build-images.outputs.video_worker_changed == 'true' && needs.build-images.outputs.video_worker_image_sha || needs.build-images.outputs.video_worker_image_branch }}
          EVOLUTION_API_IMAGE: ${{ needs.build-images.outputs.evolution_changed == 'true' && needs.build-images.outputs.evolution_image_sha || needs.build-images.outputs.evolution_image_branch }}
          MIGRATE: ${{ github.event.inputs.MIGRATE || 'false' }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS_FILE="$(mktemp)"
          LOCAL_STAGE="$(mktemp -d)"
          BUNDLE_DIR="$LOCAL_STAGE/bundle"
          REMOTE_STAGE=""
          chmod 700 "$LOCAL_STAGE"

          SSH_OPTIONS=(
            -i "$KEY_FILE"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=10
          )

          cleanup() {
            if [ -n "$REMOTE_STAGE" ]; then
              ssh "${SSH_OPTIONS[@]}" "$HETZNER_USER@$HETZNER_HOST" \
                "rm -rf -- '$REMOTE_STAGE'" >/dev/null 2>&1 || true
              REMOTE_STAGE=""
            fi
            rm -rf -- "$LOCAL_STAGE"
            rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup EXIT HUP INT TERM

          printf '%s\n' "$HETZNER_SSH_KEY" > "$KEY_FILE"
          if [ -z "$HETZNER_KNOWN_HOSTS" ]; then
            echo "::error::Pinned Hetzner host key is missing"
            exit 1
          fi
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KEY_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"
          export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/prepare_deploy_bundle.py --output-dir "$BUNDLE_DIR"

          REMOTE_STAGE="$(
            ssh "${SSH_OPTIONS[@]}" "$HETZNER_USER@$HETZNER_HOST" \
              'umask 077; install -d -m 700 "$HOME/.assonam-deploy"; mktemp -d "$HOME/.assonam-deploy/run.XXXXXX"'
          )"
          if [ -z "$REMOTE_STAGE" ]; then
            echo "::error::Unable to create protected remote deployment stage"
            exit 1
          fi
          if [[ ! "$REMOTE_STAGE" =~ ^/[A-Za-z0-9._/-]+/\.assonam-deploy/run\.[A-Za-z0-9]{6}$ ]] \
            || [[ "$REMOTE_STAGE" == *"/../"* ]] \
            || [[ "$REMOTE_STAGE" == *"/./"* ]] \
            || [[ "$REMOTE_STAGE" == *"//"* ]]; then
            REMOTE_STAGE=""
            echo "::error::Remote deployment stage path is invalid"
            exit 1
          fi

          scp -p "${SSH_OPTIONS[@]}" \
            "$BUNDLE_DIR/app.env" \
            "$BUNDLE_DIR/control.env" \
            "$BUNDLE_DIR/ghcr.token" \
            "$HETZNER_USER@$HETZNER_HOST:$REMOTE_STAGE/"

          ssh "${SSH_OPTIONS[@]}" "$HETZNER_USER@$HETZNER_HOST" \
            "DEPLOY_STAGE='$REMOTE_STAGE' bash -se" \
            < scripts/deploy_remote.sh
          REMOTE_STAGE=""
