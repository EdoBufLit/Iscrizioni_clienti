name: Deploy to Hetzner

on:
  push:
    branches:
      - association-signup-feature-1416851812972636353
      - feat/**
  workflow_dispatch:
    inputs:
      MIGRATE:
        description: Run SQLite -> Postgres import before deploy restart
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check worker Dockerfile path
        run: |
          set -euo pipefail
          if [ ! -f "Dockerfile.affiliation-video-worker" ]; then
            echo "::error::Missing Dockerfile.affiliation-video-worker referenced by docker-compose.yml"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd "${{ secrets.APP_PATH }}"
            if [ ! -f "docker-compose.yml" ]; then
              echo "::error::docker-compose.yml not found in APP_PATH=${{ secrets.APP_PATH }}"
              exit 1
            fi
            export COMPOSE_PROJECT_NAME="app"
            echo "[deploy] COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            git fetch --all

            BRANCH="${{ github.ref_name }}"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            DATABASE_URL='${{ secrets.DATABASE_URL }}'
            POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
            BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            cat > .env <<'EOF'
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            BASE_URL=${{ secrets.BASE_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            UPLOAD_DIR=${{ secrets.UPLOAD_DIR }}
            SPA_DIR=${{ secrets.SPA_DIR }}
            GOOGLE_WALLET_ISSUER_ID=${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
            GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
            GOOGLE_WALLET_SA_B64=${{ secrets.GOOGLE_WALLET_SA_B64 }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_USE_TLS=${{ secrets.SMTP_USE_TLS }}
            MAIL_FROM_DOMAIN=${{ secrets.MAIL_FROM_DOMAIN }}
            ASSOCIATION_MAIL_API_TOKEN=${{ secrets.ASSOCIATION_MAIL_API_TOKEN }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
            TWILIO_ALERT_FLOW_SID=${{ secrets.TWILIO_ALERT_FLOW_SID }}
            TWILIO_WHATSAPP_FROM=${{ secrets.TWILIO_WHATSAPP_FROM }}
            ADMIN_PHONE_E164=${{ secrets.ADMIN_PHONE_E164 }}
            TWILIO_SMS_FROM=${{ secrets.TWILIO_SMS_FROM }}
            AFFILIATION_VIDEO_WORKER_ENABLED=${{ secrets.AFFILIATION_VIDEO_WORKER_ENABLED }}
            AFFILIATION_VIDEO_ENABLED=${{ secrets.AFFILIATION_VIDEO_ENABLED }}
            EOF
            printf 'GIT_SHA=%s\n' '${{ github.sha }}' >> .env
            printf 'BUILD_TIME=%s\n' "$BUILD_TIME" >> .env
            AFFILIAZIONE_ENABLED='${{ secrets.AFFILIAZIONE_ENABLED }}'
            if [ -z "${AFFILIAZIONE_ENABLED:-}" ]; then
              AFFILIAZIONE_ENABLED="false"
            fi
            AFFILIAZIONE_ENABLED="$(echo "$AFFILIAZIONE_ENABLED" | tr '[:upper:]' '[:lower:]')"
            printf 'AFFILIAZIONE_ENABLED=%s\n' "$AFFILIAZIONE_ENABLED" >> .env
            echo "AFFILIAZIONE_ENABLED=$AFFILIAZIONE_ENABLED"
            if ! grep -q '^AFFILIATION_VIDEO_WORKER_ENABLED=' .env; then
              printf 'AFFILIATION_VIDEO_WORKER_ENABLED=false\n' >> .env
            fi
            if ! grep -q '^AFFILIATION_VIDEO_ENABLED=' .env; then
              printf 'AFFILIATION_VIDEO_ENABLED=true\n' >> .env
            fi
            chmod 600 .env

            AFFILIATION_VIDEO_WORKER_ENABLED='${{ secrets.AFFILIATION_VIDEO_WORKER_ENABLED }}'
            if [ -z "${AFFILIATION_VIDEO_WORKER_ENABLED:-}" ]; then
              AFFILIATION_VIDEO_WORKER_ENABLED="false"
            fi
            AFFILIATION_VIDEO_WORKER_ENABLED="$(echo "$AFFILIATION_VIDEO_WORKER_ENABLED" | tr '[:upper:]' '[:lower:]')"
            echo "AFFILIATION_VIDEO_WORKER_ENABLED=$AFFILIATION_VIDEO_WORKER_ENABLED"
            AFFILIATION_VIDEO_ENABLED='${{ secrets.AFFILIATION_VIDEO_ENABLED }}'
            if [ -z "${AFFILIATION_VIDEO_ENABLED:-}" ]; then
              AFFILIATION_VIDEO_ENABLED="true"
            fi
            AFFILIATION_VIDEO_ENABLED="$(echo "$AFFILIATION_VIDEO_ENABLED" | tr '[:upper:]' '[:lower:]')"
            echo "AFFILIATION_VIDEO_ENABLED=$AFFILIATION_VIDEO_ENABLED"
            COMPOSE_PROFILE_ARGS=""
            if [ "$AFFILIATION_VIDEO_WORKER_ENABLED" = "true" ]; then
              COMPOSE_PROFILE_ARGS="--profile video-worker"
            fi

            COMPOSE_FILES="-f docker-compose.yml"
            if [ -f "docker-compose.prod.yml" ] && [ -f "secrets/google-wallet-sa.json" ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.prod.yml"
            fi

            MIGRATE='${{ github.event.inputs.MIGRATE || 'false' }}'
            echo "[deploy] MIGRATE=${MIGRATE}"

            if [ "$MIGRATE" = "true" ]; then
              echo "[migrate] MIGRATE=true: starting Postgres service only"
              echo "[migrate] Reminder: DATABASE_URL GitHub secret must already be set to the Postgres URL before cutover restart."

              if [ -z "${POSTGRES_PASSWORD:-}" ]; then
                echo "[migrate] POSTGRES_PASSWORD is empty. Set the GitHub secret and re-run."
                exit 1
              fi

              docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS up -d db

              echo "[migrate] Waiting for Postgres readiness (up to 60s)"
              PG_READY=0
              for i in $(seq 1 60); do
                if docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS exec -T db pg_isready -U assonam -d assonam; then
                  PG_READY=1
                  echo "[migrate] Postgres is ready"
                  break
                fi
                sleep 1
              done

              if [ "$PG_READY" -ne 1 ]; then
                echo "[migrate] Postgres did not become ready within 60s"
                exit 1
              fi

              SQLITE_SOURCE="$(pwd)/data/app.db"
              if [ ! -f "$SQLITE_SOURCE" ]; then
                SQLITE_SOURCE="/opt/assonam/app/data/app.db"
              fi
              if [ ! -f "$SQLITE_SOURCE" ]; then
                echo "[migrate] SQLite source file not found (checked $(pwd)/data/app.db and /opt/assonam/app/data/app.db)"
                exit 1
              fi

              echo "[migrate] Running pgloader import on network app_default from $SQLITE_SOURCE"
              docker run --rm \
                --network app_default \
                -v "$SQLITE_SOURCE:/tmp/app.db:ro" \
                dimitri/pgloader:latest \
                pgloader "sqlite:///tmp/app.db" "postgresql://assonam:${POSTGRES_PASSWORD}@db:5432/assonam"

              echo "[migrate] Repairing common SQLite->Postgres schema issues (booleans + id sequences/defaults)"
              psql_exec() {
                docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS exec -T db psql -U assonam -d assonam -v ON_ERROR_STOP=1 -c "$1"
              }
              psql_query() {
                docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS exec -T db psql -U assonam -d assonam -At -v ON_ERROR_STOP=1 -c "$1"
              }
              repair_bool_col() {
                table_name="$1"
                column_name="$2"
                default_sql="$3"
                exists="$(psql_query "SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='${table_name}' AND column_name='${column_name}' LIMIT 1;")"
                if [ "$exists" = "1" ]; then
                  echo "[migrate] Repair boolean ${table_name}.${column_name}"
                  psql_exec "ALTER TABLE public.${table_name} ALTER COLUMN ${column_name} DROP DEFAULT;
                  ALTER TABLE public.${table_name} ALTER COLUMN ${column_name} TYPE boolean USING CASE
                    WHEN ${column_name} IS NULL THEN NULL
                    WHEN lower(trim(${column_name}::text)) IN ('1','t','true','y','yes','on') THEN TRUE
                    ELSE FALSE
                  END;
                  ALTER TABLE public.${table_name} ALTER COLUMN ${column_name} SET DEFAULT ${default_sql};"
                fi
              }
              repair_id_sequence() {
                table_name="$1"
                exists="$(psql_query "SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='${table_name}' AND column_name='id' AND data_type IN ('integer','bigint') LIMIT 1;")"
                if [ "$exists" = "1" ]; then
                  echo "[migrate] Repair id sequence for ${table_name}"
                  psql_exec "CREATE SEQUENCE IF NOT EXISTS public.${table_name}_id_seq;
                  ALTER TABLE public.${table_name} ALTER COLUMN id SET DEFAULT nextval('public.${table_name}_id_seq'::regclass);
                  ALTER SEQUENCE public.${table_name}_id_seq OWNED BY public.${table_name}.id;
                  SELECT setval('public.${table_name}_id_seq'::regclass, COALESCE((SELECT MAX(id) + 1 FROM public.${table_name}), 1), false);"
                fi
              }

              repair_bool_col organizations is_active TRUE
              repair_bool_col organizations wallet_is_test_prefix FALSE
              repair_bool_col admin_users is_active TRUE
              repair_bool_col members is_manual FALSE
              repair_bool_col integration_api_keys is_active TRUE

              for table_name in organizations admin_users card_batches members org_admin_tokens card_movements member_documents tokens operation_logs member_payments integration_api_keys ingest_rate_limits onboarding_tours; do
                repair_id_sequence "$table_name"
              done

              echo "[migrate] Import complete. Verifying DATABASE_URL is not SQLite before restarting the app"
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "[migrate] DATABASE_URL is empty. Set it to the Postgres URL and re-run."
                exit 1
              fi
              if echo "$DATABASE_URL" | grep -qi "sqlite"; then
                echo "[migrate] DATABASE_URL is still SQLite. Set it to Postgres and re-run."
                exit 1
              fi

              echo "[migrate] Running Alembic migrations on Postgres before app restart"
              docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS run --rm --build web alembic upgrade head
            fi

            echo "[deploy] Cleaning stale service containers to avoid name conflicts"
            docker compose $COMPOSE_FILES $COMPOSE_PROFILE_ARGS rm -f -s web email-worker low-cards-worker affiliation-video-worker || true
            for stale_pattern in "_app-web-1" "_app-email-worker-1" "_app-low-cards-worker-1" "_app-affiliation-video-worker-1"; do
              STALE_IDS="$(docker ps -aq --filter "name=${stale_pattern}" || true)"
              if [ -n "${STALE_IDS}" ]; then
                echo "[deploy] Removing stale containers (${stale_pattern}): ${STALE_IDS}"
                docker rm -f ${STALE_IDS} || true
              fi
            done

            echo "[deploy] Docker diagnostics before builder cleanup"
            docker system df || true
            docker builder ls || true
            docker buildx ls || true

            echo "[deploy] Pruning Docker builder cache safely"
            docker builder prune -af || true
            docker buildx prune -af || true

            if [ "$AFFILIATION_VIDEO_WORKER_ENABLED" = "true" ]; then
              echo "[deploy] Running docker compose --profile video-worker build --no-cache"
              docker compose $COMPOSE_FILES --profile video-worker build --no-cache
              echo "[deploy] Running docker compose --profile video-worker up -d --remove-orphans"
              docker compose $COMPOSE_FILES --profile video-worker up -d --remove-orphans
            else
              echo "[deploy] Running docker compose build --no-cache"
              docker compose $COMPOSE_FILES build --no-cache
              echo "[deploy] Running docker compose up -d --remove-orphans"
              docker compose $COMPOSE_FILES up -d --remove-orphans
            fi

            if [ "$AFFILIATION_VIDEO_WORKER_ENABLED" = "true" ]; then
              echo "[deploy] Sanity check: waiting up to 90s for affiliation-video-worker health"
              WORKER_CID=""
              for i in $(seq 1 10); do
                WORKER_CID="$(docker compose $COMPOSE_FILES --profile video-worker ps -q affiliation-video-worker || true)"
                if [ -n "$WORKER_CID" ]; then
                  break
                fi
                sleep 1
              done

              if [ -z "$WORKER_CID" ]; then
                echo "::error::affiliation-video-worker container id not found after deploy"
                docker compose $COMPOSE_FILES --profile video-worker ps || true
                docker compose $COMPOSE_FILES --profile video-worker logs --tail=200 affiliation-video-worker || true
                docker compose $COMPOSE_FILES logs --tail=200 web || true
                exit 1
              fi

              WORKER_STATUS="starting"
              for i in $(seq 1 90); do
                WORKER_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$WORKER_CID" 2>/dev/null || true)"
                if [ "$WORKER_STATUS" = "healthy" ]; then
                  break
                fi
                if [ "$WORKER_STATUS" = "unhealthy" ] || [ "$WORKER_STATUS" = "exited" ] || [ "$WORKER_STATUS" = "dead" ]; then
                  break
                fi
                sleep 1
              done

              if [ "$WORKER_STATUS" != "healthy" ]; then
                echo "::error::affiliation-video-worker not healthy after 90s (status=$WORKER_STATUS)"
                docker compose $COMPOSE_FILES --profile video-worker ps || true
                docker compose $COMPOSE_FILES --profile video-worker logs --tail=200 affiliation-video-worker || true
                docker compose $COMPOSE_FILES logs --tail=200 web || true
                exit 1
              fi
              echo "[deploy] affiliation-video-worker healthy (cid=$WORKER_CID)"
            fi
            echo "[deploy] Pruning images"
            docker image prune -f || true

