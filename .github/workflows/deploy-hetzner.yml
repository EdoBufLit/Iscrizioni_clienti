name: Deploy to Hetzner

on:
  push:
    branches:
      - association-signup-feature-1416851812972636353
  workflow_dispatch:
    inputs:
      MIGRATE:
        description: Run SQLite -> Postgres import before deploy restart
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd "${{ secrets.APP_PATH }}"
            git fetch --all

            BRANCH="${{ github.ref_name }}"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            # ---- Required env (per ENV_REQUIRED.md) ----
            export SECRET_KEY='${{ secrets.SECRET_KEY }}'
            export BASE_URL='${{ secrets.BASE_URL }}'
            export SUPER_ADMIN_EMAIL='${{ secrets.SUPER_ADMIN_EMAIL }}'
            export SUPER_ADMIN_PASSWORD='${{ secrets.SUPER_ADMIN_PASSWORD }}'

            # ---- Optional env ----
            # If not set as secrets, these will just be empty and app uses defaults/fallbacks.
            export DATABASE_URL='${{ secrets.DATABASE_URL }}'
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'
            export UPLOAD_DIR='${{ secrets.UPLOAD_DIR }}'
            export SPA_DIR='${{ secrets.SPA_DIR }}'
            export FRONTEND_URL='${{ secrets.FRONTEND_URL }}'

            # Google Wallet (optional: use file path or base64 fallback)
            export GOOGLE_WALLET_ISSUER_ID='${{ secrets.GOOGLE_WALLET_ISSUER_ID }}'
            export GOOGLE_APPLICATION_CREDENTIALS='${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'
            export GOOGLE_WALLET_SA_B64='${{ secrets.GOOGLE_WALLET_SA_B64 }}'

            # SMTP (set these secrets only if you want real email sending)
            export SMTP_HOST='${{ secrets.SMTP_HOST }}'
            export SMTP_PORT='${{ secrets.SMTP_PORT }}'
            export SMTP_USER='${{ secrets.SMTP_USER }}'
            export SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'
            export SMTP_FROM='${{ secrets.SMTP_FROM }}'
            export SMTP_USE_TLS='${{ secrets.SMTP_USE_TLS }}'

            # Build metadata
            export GIT_SHA='${{ github.sha }}'
            export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            COMPOSE_FILES="-f docker-compose.yml"
            if [ -f "docker-compose.prod.yml" ] && [ -f "secrets/google-wallet-sa.json" ]; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.prod.yml"
            fi

            MIGRATE='${{ github.event.inputs.MIGRATE || 'false' }}'
            echo "[deploy] MIGRATE=${MIGRATE}"

            if [ "$MIGRATE" = "true" ]; then
              echo "[migrate] MIGRATE=true: starting Postgres service only"
              echo "[migrate] Reminder: DATABASE_URL GitHub secret must already be set to the Postgres URL before cutover restart."

              if [ -z "${POSTGRES_PASSWORD:-}" ]; then
                echo "[migrate] POSTGRES_PASSWORD is empty. Set the GitHub secret and re-run."
                exit 1
              fi

              docker compose $COMPOSE_FILES up -d db

              echo "[migrate] Waiting for Postgres readiness (up to 60s)"
              PG_READY=0
              for i in $(seq 1 60); do
                if docker compose $COMPOSE_FILES exec -T db pg_isready -U assonam -d assonam; then
                  PG_READY=1
                  echo "[migrate] Postgres is ready"
                  break
                fi
                sleep 1
              done

              if [ "$PG_READY" -ne 1 ]; then
                echo "[migrate] Postgres did not become ready within 60s"
                exit 1
              fi

              SQLITE_SOURCE="$(pwd)/data/app.db"
              if [ ! -f "$SQLITE_SOURCE" ]; then
                SQLITE_SOURCE="/opt/assonam/app/data/app.db"
              fi
              if [ ! -f "$SQLITE_SOURCE" ]; then
                echo "[migrate] SQLite source file not found (checked $(pwd)/data/app.db and /opt/assonam/app/data/app.db)"
                exit 1
              fi

              echo "[migrate] Running pgloader import on network app_default from $SQLITE_SOURCE"
              docker run --rm \
                --network app_default \
                -v "$SQLITE_SOURCE:/tmp/app.db:ro" \
                dimitri/pgloader:latest \
                pgloader "sqlite:///tmp/app.db" "postgresql://assonam:${POSTGRES_PASSWORD}@db:5432/assonam"

              echo "[migrate] Repairing common SQLite->Postgres schema issues (booleans + id sequences/defaults)"
              docker compose $COMPOSE_FILES exec -T db psql -U assonam -d assonam -v ON_ERROR_STOP=1 <<'SQL'
              DO $$
              DECLARE
                rec RECORD;
                next_id BIGINT;
                seq_regclass TEXT;
              BEGIN
                -- Normalize boolean-like columns often imported as bigint/text by pgloader from SQLite.
                FOR rec IN
                  SELECT *
                  FROM (
                    VALUES
                      ('organizations', 'is_active', 'TRUE'),
                      ('organizations', 'wallet_is_test_prefix', 'FALSE'),
                      ('admin_users', 'is_active', 'TRUE'),
                      ('members', 'is_manual', 'FALSE'),
                      ('integration_api_keys', 'is_active', 'TRUE')
                  ) AS v(table_name, column_name, default_sql)
                LOOP
                  IF EXISTS (
                    SELECT 1
                    FROM information_schema.columns
                    WHERE table_schema = 'public'
                      AND table_name = rec.table_name
                      AND column_name = rec.column_name
                  ) THEN
                    EXECUTE format(
                      'ALTER TABLE public.%I ALTER COLUMN %I TYPE boolean USING CASE
                         WHEN %I IS NULL THEN NULL
                         WHEN lower(trim(%I::text)) IN (''1'',''t'',''true'',''y'',''yes'',''on'') THEN TRUE
                         ELSE FALSE
                       END',
                      rec.table_name,
                      rec.column_name,
                      rec.column_name,
                      rec.column_name
                    );
                    EXECUTE format(
                      'ALTER TABLE public.%I ALTER COLUMN %I SET DEFAULT %s',
                      rec.table_name,
                      rec.column_name,
                      rec.default_sql
                    );
                  END IF;
                END LOOP;

                -- Ensure every integer/bigint PK id column has a sequence/DEFAULT for INSERTs.
                FOR rec IN
                  SELECT c.table_name
                  FROM information_schema.columns c
                  JOIN information_schema.table_constraints tc
                    ON tc.table_schema = c.table_schema
                   AND tc.table_name = c.table_name
                   AND tc.constraint_type = 'PRIMARY KEY'
                  JOIN information_schema.key_column_usage kcu
                    ON kcu.constraint_schema = tc.constraint_schema
                   AND kcu.constraint_name = tc.constraint_name
                   AND kcu.table_schema = tc.table_schema
                   AND kcu.table_name = tc.table_name
                   AND kcu.column_name = c.column_name
                  WHERE c.table_schema = 'public'
                    AND c.column_name = 'id'
                    AND c.data_type IN ('integer', 'bigint')
                LOOP
                  EXECUTE format('CREATE SEQUENCE IF NOT EXISTS public.%I_id_seq', rec.table_name);
                  seq_regclass := format('public.%s_id_seq', rec.table_name);

                  EXECUTE format(
                    'ALTER TABLE public.%I ALTER COLUMN id SET DEFAULT nextval(%L::regclass)',
                    rec.table_name,
                    seq_regclass
                  );
                  EXECUTE format(
                    'ALTER SEQUENCE public.%I_id_seq OWNED BY public.%I.id',
                    rec.table_name,
                    rec.table_name
                  );

                  EXECUTE format('SELECT COALESCE(MAX(id), 0) + 1 FROM public.%I', rec.table_name)
                    INTO next_id;
                  EXECUTE format(
                    'SELECT setval(%L::regclass, %s, false)',
                    seq_regclass,
                    next_id::TEXT
                  );
                END LOOP;
              END $$;
              SQL

              echo "[migrate] Import complete. Verifying DATABASE_URL is not SQLite before restarting the app"
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "[migrate] DATABASE_URL is empty. Set it to the Postgres URL and re-run."
                exit 1
              fi
              if echo "$DATABASE_URL" | grep -qi "sqlite"; then
                echo "[migrate] DATABASE_URL is still SQLite. Set it to Postgres and re-run."
                exit 1
              fi
            fi

            echo "[deploy] Running docker compose up -d --build"
            docker compose $COMPOSE_FILES up -d --build
            echo "[deploy] Pruning images"
            docker image prune -f || true

