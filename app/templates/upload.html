{% extends "base.html" %}

{% block title %}Complete Registration{% endblock %}

{% block content %}
    <h2>Complete Your Registration</h2>
    <p>Welcome, {{ member.first_name }} {{ member.last_name }}. To activate your membership, please upload the required documents.</p>

    <form action="/join/continue" method="post" enctype="multipart/form-data">
        <input type="hidden" name="token" value="{{ token }}">

        <div class="form-group">
            <label for="id_document">ID Document (Front/Back or Single PDF)</label><br>
            <input type="file" id="id_document" name="id_document" required>
        </div>

        <div class="form-group">
            <label for="fiscal_code_document">Fiscal Code / Tessera Sanitaria</label><br>
            <input type="file" id="fiscal_code_document" name="fiscal_code_document" required>
        </div>

        <button type="submit" class="button">Complete Registration</button>
    </form>
{% endblock %}
