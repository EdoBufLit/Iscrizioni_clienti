<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Association Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Association Portal</a>

      <nav class="nav">
        {% if request.session.get("member_id") %}
          <a href="/member/portal">Portal</a>
          <a href="/member/logout" class="btn btn-ghost">Logout</a>
        {% else %}
          <a href="/member/login" class="btn btn-ghost">Login</a>
        {% endif %}
      </nav>
    </div>
  </header>

  {% block hero %}{% endblock %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
