<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ASSO.N.A.M.{% endblock %}</title>

  <link rel="stylesheet" href="/static/style.css" />

  <!-- Favicons / mask -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/fav/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/fav/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/fav/apple-touch-icon.png">
  <link rel="mask-icon" href="/static/fav/safari-pinned-tab.svg" color="#1b2aa6">
  <meta name="theme-color" content="#070914">
</head>

<body>
  <header class="site-header">
    <div class="header-inner header-landing">
      <!-- Left: Brand -->
      <a class="brand" href="/">ASSO.N.A.M.</a>

      <!-- Center: Landing sections + Associazioni -->
      <nav class="nav nav-center">
        <a href="/#servizi">Servizi</a>
        <a href="/#metodo">Metodo</a>
        <a href="/associazioni">Associazioni</a>
        <a href="/#faq">FAQ</a>
        <a href="/#contatti">Contatti</a>
      </nav>

      <!-- Right: CTA -->
      <div class="nav nav-right">
        {% if request.session.get("member_id") %}
          <a href="/member/portal" class="btn btn-primary">Portale</a>
          <a href="/member/logout" class="btn btn-ghost">Logout</a>
        {% else %}
          <a href="/member/login" class="btn btn-primary">Area riservata</a>
        {% endif %}
      </div>
    </div>
  </header>

  {% block hero %}{% endblock %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Header: minimal, compare con scroll -->
  <script>
  (function () {
    const header = document.querySelector('.site-header');
    if (!header) return;

    let lastY = window.scrollY || 0;

    const update = () => {
      const y = window.scrollY || 0;

      // Modalità "premium": appare quando risali (e non subito)
      const show = y > 80 && y < lastY;

      header.classList.toggle('is-visible', show);
      lastY = y;
    };

    update();
    window.addEventListener('scroll', update, { passive: true });
  })();
  </script>

  <!-- Active link sulle sezioni (solo anchor) -->
  <script>
  (() => {
    const navLinks = Array.from(document.querySelectorAll('.nav-center a[href^="/#"], .nav-center a[href^="#"]'));
    if (!navLinks.length) return;

    const getTargetId = (href) => {
      const hashIndex = href.indexOf('#');
      return hashIndex >= 0 ? href.slice(hashIndex + 1) : null;
    };

    const items = navLinks
      .map(a => {
        const id = getTargetId(a.getAttribute('href') || '');
        const el = id ? document.getElementById(id) : null;
        return { a, id, el };
      })
      .filter(x => x.el);

    if (!items.length) return;

    const setActive = (id) => {
      for (const {a, id: linkId} of items) {
        a.classList.toggle('is-active', linkId === id);
      }
    };

    const getHeaderOffset = () => {
      const header = document.querySelector('.site-header');
      return (header?.offsetHeight || 0) + 14;
    };

    let currentObserver = null;
    const rebuildObserver = () => {
      if (currentObserver) currentObserver.disconnect();
      const offset = getHeaderOffset();

      currentObserver = new IntersectionObserver((entries) => {
        let best = null;
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
        }
        if (best?.target?.id) setActive(best.target.id);
      }, {
        threshold: [0.15, 0.25, 0.35, 0.5, 0.65],
        rootMargin: `-${offset}px 0px -55% 0px`
      });

      items.forEach(({el}) => currentObserver.observe(el));
    };

    navLinks.forEach(a => {
      a.addEventListener('click', () => {
        const id = getTargetId(a.getAttribute('href') || '');
        if (id) setActive(id);
      });
    });

    rebuildObserver();
    window.addEventListener('resize', () => {
      clearTimeout(window.__navResizeT);
      window.__navResizeT = setTimeout(rebuildObserver, 150);
    });

    const initialHash = (location.hash || '').replace('#','');
    if (initialHash) setActive(initialHash);
  })();
  </script>
</body>
</html>
