{% extends "base.html" %}

{% block title %}ASSO.N.A.M.{% endblock %}

{% block hero %}
<section class="hero">
    <div class="hero__overlay"></div>
    <div class="hero__content">
        <svg class="hero__title" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Desktop Curve: Higher Arc -->
                <path id="curveDesktop" d="M 120 280 Q 600 20 1080 280" fill="transparent"/>
                <!-- Mobile Curve: Flatter Arc -->
                <path id="curveMobile" d="M 120 280 Q 600 120 1080 280" fill="transparent"/>

                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>
            <text width="1200">
                <textPath id="heroTextPath" href="#curveDesktop" startOffset="50%" text-anchor="middle" class="hero__title-text">
                    ASSO.N.A.M.
                </textPath>
            </text>
        </svg>
        <p class="hero__subtitle">Associazione Nazionale Arti e Mestieri</p>
        <a class="hero__cta" href="/associazioni">Scopri le associazioni affiliate</a>
    </div>
</section>

<script>
    (function() {
        const textPath = document.querySelector('#heroTextPath');
        const updateCurve = () => {
            const isDesktop = window.matchMedia('(min-width: 768px)').matches;
            textPath.setAttribute('href', isDesktop ? '#curveDesktop' : '#curveMobile');
        };
        window.addEventListener('resize', updateCurve);
        // Initial call
        updateCurve();
    })();
</script>
{% endblock %}

{% block content %}
<div style="text-align: center; padding: 50px;">
    <h2>Benvenuti nel portale</h2>
    <p>Utilizza il menu in alto per accedere ai servizi.</p>
</div>
{% endblock %}
