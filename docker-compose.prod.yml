version: "3.8"

services:
  web:
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_wallet_sa.json
    volumes:
      - ./secrets/google-wallet-sa.json:/run/secrets/google_wallet_sa.json:ro

  email-worker:
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_wallet_sa.json
    volumes:
      - ./secrets/google-wallet-sa.json:/run/secrets/google_wallet_sa.json:ro

  low-cards-worker:
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_wallet_sa.json
    volumes:
      - ./secrets/google-wallet-sa.json:/run/secrets/google_wallet_sa.json:ro

  migrate:
    environment:
      APP_ENV: production

  file-deletion-worker:
    environment:
      APP_ENV: production

  whatsapp-webhook-worker:
    environment:
      APP_ENV: production

  affiliation-video-worker:
    environment:
      APP_ENV: production
